<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Beauty Spa</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI', sans-serif;
}

body{
  background:linear-gradient(to right,#d8e3dc,#f2c6b4);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.contact-box{
  width:400px;
  background:white;
  padding:45px;
  border-radius:30px;
  text-align:center;
  box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

.contact-box h1{
  color:#d88f75;
  margin-bottom:15px;
  font-size:35px;
}

.contact-box p{
  color:#555;
  margin-bottom:25px;
  line-height:1.7;
}

.info{
  background:#f8f6f4;
  padding:15px;
  border-radius:15px;
  margin-bottom:15px;
}

.info h3{
  color:#d88f75;
  margin-bottom:5px;
}

.info span{
  color:#444;
  font-size:14px;
}

.btn{
  margin-top:15px;
  background:#e8a58c;
  border:none;
  padding:12px 25px;
  border-radius:25px;
  color:white;
  cursor:pointer;
  transition:0.3s;
}

.btn:hover{
  background:#d88f75;
}

</style>
</head>

<body>

<div class="contact-box">

  <h1>Book Now</h1>

  <p>
    Contact us for spa reservations and more information about our treatments.
  </p>

  <div class="info">
    <h3>Email</h3>
    <span>beautyspa@gmail.com</span>
  </div>

  <div class="info">
    <h3>Phone</h3>
    <span>+62 858 0063 1625</span>
  </div>

  <div class="info">
    <h3>Location</h3>
    <span>Indonesia</span>
  </div>

  <a href="tugas4.html">
    <button class="btn">Back to Home</button>
  </a>

</div>

</body>
</html>
